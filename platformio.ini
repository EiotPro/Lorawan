[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

[env:rpipicow]
board = rpipicow

; Filesystem configuration for LittleFS
board_build.filesystem_size = 1m

; Build options
build_flags =
    -D ARDUINO_ARCH_RP2040
    -D DEBUG_MODE=1
    -D PICO_FLASH_SIZE_BYTES=2097152

; Libraries
lib_deps =
    ; ArduinoJson for JSON formatting and OTA metadata
    bblanchon/ArduinoJson@^6.21.3

; Note: WiFi is included in Earlephilhower core
; BLE is not currently supported in Earlephilhower core for Pico W
; The stubs for BLE functionality are implemented in the code 